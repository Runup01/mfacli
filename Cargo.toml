[package]
name = "mfacli"
version = "0.1.15"
edition = "2021"
description = "A developer-friendly, local-first CLI MFA/OTP manager with encrypted storage"
license = "MIT"
repository = "https://github.com/Runup01/mfacli"
keywords = ["mfa", "otp", "totp", "2fa", "cli"]
categories = ["command-line-utilities", "authentication"]

[[bin]]
name = "mfa"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base32 = "0.5"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
colored = "2"
rpassword = "7"
url = "2"
zeroize = "1"
ratatui = "0.29"
crossterm = "0.28"
qrcode = "0.14"
image = "0.25"
rqrr = "0.8"

