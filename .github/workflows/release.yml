name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Binary builds (tarball / zip) ─────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: mfacli-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: mfacli-x86_64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: mfacli-x86_64-unknown-linux-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: mfacli-aarch64-unknown-linux-musl.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: mfacli-x86_64-pc-windows-msvc.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain (Linux static)
        if: runner.os == 'Linux' && contains(matrix.target, 'linux-musl')
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          else
            # musl libc ships with rust-std; use bundled rust-lld as cross linker (no downloads)
            SYSROOT=$(rustc --print sysroot)
            sudo ln -sf "$SYSROOT/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" /usr/local/bin/ld.lld
          fi

      - name: Build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ld.lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C linker-flavor=ld.lld
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          STEM="${{ matrix.archive }}" && STEM="${STEM%.tar.gz}"
          mkdir -p "dist/$STEM"
          cp "target/${{ matrix.target }}/release/mfa" "dist/$STEM/"
          cp README.md LICENSE "dist/$STEM/"
          tar czf "${{ matrix.archive }}" -C dist "$STEM"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $stem = "${{ matrix.archive }}" -replace '\.zip$',''
          New-Item -ItemType Directory -Path "dist/$stem" -Force
          Copy-Item target/${{ matrix.target }}/release/mfa.exe "dist/$stem/"
          Copy-Item README.md "dist/$stem/"
          Copy-Item LICENSE "dist/$stem/"
          Compress-Archive -Path "dist/$stem" -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # ── Linux packages (DEB + RPM) ────────────────────────────────
  package-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            rpm_arch: x86_64
          - arch: arm64
            target: aarch64-unknown-linux-musl
            rpm_arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain (Linux static)
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          else
            SYSROOT=$(rustc --print sysroot)
            sudo ln -sf "$SYSROOT/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" /usr/local/bin/ld.lld
          fi

      - name: Build binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ld.lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C linker-flavor=ld.lld
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.41.1
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare staging
        run: |
          mkdir -p pkg
          cp target/${{ matrix.target }}/release/mfa pkg/
          cp README.md LICENSE nfpm.yaml pkg/

      - name: Build .deb
        working-directory: pkg
        env:
          MFA_VERSION: ${{ steps.ver.outputs.version }}
          MFA_ARCH: ${{ matrix.arch }}
        run: |
          nfpm package --packager deb --target "../mfacli_${MFA_VERSION}_${{ matrix.arch }}.deb"

      - name: Build .rpm
        working-directory: pkg
        env:
          MFA_VERSION: ${{ steps.ver.outputs.version }}
          MFA_ARCH: ${{ matrix.arch }}
        run: |
          nfpm package --packager rpm --target "../mfacli-${MFA_VERSION}-1.${{ matrix.rpm_arch }}.rpm"

      - name: Version-less aliases (stable latest/download links)
        working-directory: pkg
        env:
          MFA_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cp "../mfacli_${MFA_VERSION}_${{ matrix.arch }}.deb" "../mfacli_${{ matrix.arch }}.deb"
          cp "../mfacli-${MFA_VERSION}-1.${{ matrix.rpm_arch }}.rpm" "../mfacli-${{ matrix.rpm_arch }}.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.arch }}
          path: |
            mfacli_*.deb
            mfacli-*.rpm
          if-no-files-found: error

  # ── Single release publisher (one writer, no race) ────────────
  release:
    needs: [build, package-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets

      - name: Publish release with all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: assets/*
